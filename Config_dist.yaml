# You must restart the bot if you modify this file. And if you use the web display of the history,
# don’t forget Uvicorn.

Server_timezone:             "Europe/Paris"

Discord:
  Bot_owner:                 ""
  # Your Discord token. See https://discordpy.readthedocs.io/en/stable/discord.html
  Token:                     ""
  Bot_name:                  "name for the bot to display in the history"

# In lowercase, so that it can be used as-is by the package mysqlclient
mysqlclient:
  host:                      ""
  user:                      ""
  password:                  ""
  database:                  ""
  charset:                   "utf8mb4"
  # Guarantee UTC regardless of server configuration
  init_command:              "SET time_zone = '+00:00'"

Mail:
  Server:                    ""
  Bot_address:               ""

Localization:
  Default_language:          "English"
  Available_languages:
    - English
    - French

Projects:
  - Name:                    "project1"
    Discord_server:          ID_server1
    History:
      Enable:                True/False
      # When the bot is added to a new server, should it save the existing history?
      Sync_old:              True/False
      Table:                 "bot_server1_history"
      Chans_table:           "bot_server1_chans"
      Storage_folder:        "/path/to/bot_files/server1"
      Storage_url:           "https://domain.tld/bot_files/server1"

  - Name:                    "project2"
    Discord_server:          ID_server2
    History:
      Enable:                True/False
      Sync_old:              True/False
      Table:                 "bot_server2_history"
      Chans_table:           "bot_server2_chans"
      Storage_folder:        "/path/to/bot_files/server2"
      Storage_url:           "https://domain.tld/bot_files/server2"

Users:
  Table:                     "project_users"

Polls:
  Table:                     "project_polls"

IRC:
  Bot_owner:                 ""
  Server:                    "irc.libera.chat"
  Nick:                      "MyBot"
  Username:                  "my_bot"
  Real_name:                 "My Bot"
  Password:                  ""
  Quit_message:              "That’s the end of the beans"

IRC_bridges:
  chan1:
    Discord_chan:            ID_chan1
    # If you want messages on Discord displayed as coming from the users instead of the bot.
    # See https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks
    Webhook:                 ""
  chan2:
    Discord_chan:            ID_chan2
    Webhook:                 ""
